<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnerTube Audio Streamer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px;
      background: #0f1115;
      color: #f1f5f9;
    }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    ul { list-style: none; padding: 0; margin: 0 0 24px 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin-bottom: 8px;
      background: #1e293b;
      border-radius: 8px;
    }
    .meta { display: flex; flex-direction: column; }
    .title { font-weight: 600; }
    .artist { font-size: 0.85rem; color: #94a3b8; }
    .player-box {
      position: sticky;
      bottom: 16px;
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    #nowPlaying { font-size: 0.9rem; margin-bottom: 8px; color: #cbd5e1; }
    audio { width: 100%; }
  </style>
</head>
<body>
  <h1>InnerTube Web Audio Player</h1>

  <div class="row">
    <input type="text" id="searchInput" placeholder="Search songs on YouTube Music..." onkeydown="if(event.key==='Enter') searchSongs()" />
    <button onclick="searchSongs()">Search</button>
  </div>

  <div class="row">
    <input type="text" id="idInput" placeholder="Or paste a Video ID / YouTube URL..." />
    <button onclick="playDirect()">Play ID</button>
  </div>

  <ul id="results"></ul>

  <div class="player-box">
    <div id="nowPlaying">Select a track to stream audio</div>
    <audio id="player" controls autoplay></audio>
  </div>

  <script>
    async function searchSongs() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      const list = document.getElementById('results');
      list.innerHTML = '<li>Searching...</li>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const songs = await res.json();
        if (!songs.length) {
          list.innerHTML = '<li>No results found.</li>';
          return;
        }
        list.innerHTML = songs.map(song => `
          <li>
            <div class="meta">
              <span class="title">${escapeHtml(song.title)}</span>
              <span class="artist">${escapeHtml(song.artist)}</span>
            </div>
            <button onclick="playTrack('${song.id}', '${escapeHtml(song.title)} - ${escapeHtml(song.artist)}')">Play</button>
          </li>
        `).join('');
      } catch (err) {
        list.innerHTML = '<li>Error searching tracks.</li>';
      }
    }

    function playDirect() {
      let val = document.getElementById('idInput').value.trim();
      if (!val) return;
      const match = val.match(/(?:v=|youtu\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/);
      const videoId = match ? match[1] : val;
      playTrack(videoId, `Video ID: ${videoId}`);
    }

    function playTrack(videoId, label) {
      const player = document.getElementById('player');
      document.getElementById('nowPlaying').textContent = `Streaming: ${label}`;
      player.src = `/api/stream/${encodeURIComponent(videoId)}`;
      player.play();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
  </script>
</body>
</html>
