<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnerTube Opus Audio Streamer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 { margin-bottom: 8px; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .row { display: flex; gap: 10px; margin-bottom: 16px; }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 15px;
    }
    button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    #status {
      padding: 10px 14px;
      border-radius: 8px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
      gap: 12px;
    }
    .meta { overflow: hidden; }
    .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { font-size: 13px; color: #94a3b8; }
    audio { width: 100%; margin-top: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>InnerTube Opus Audio Streamer</h2>
  <div class="subtitle">Direct InnerTube search & real-time Opus audio proxy (zero disk storage)</div>

  <div class="row">
    <input type="text" id="searchInput" placeholder="Search song or artist..." onkeydown="if(event.key==='Enter') searchSongs()" />
    <button onclick="searchSongs()">Search</button>
  </div>

  <div class="row">
    <input type="text" id="directInput" placeholder="Or paste YouTube URL / Video ID (e.g. dQw4w9WgXcQ)..." onkeydown="if(event.key==='Enter') playDirect()" />
    <button onclick="playDirect()">Play Direct</button>
  </div>

  <div id="status"></div>
  <audio id="player" controls></audio>
  <ul id="results" style="margin-top: 20px;"></ul>

  <script>
    const statusBox = document.getElementById('status');
    const player = document.getElementById('player');

    function setStatus(msg, isError = false) {
      statusBox.style.display = 'block';
      statusBox.style.color = isError ? '#f87171' : '#38bdf8';
      statusBox.textContent = msg;
    }

    async function searchSongs() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      setStatus('Searching InnerTube...');
      document.getElementById('results').innerHTML = '';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        if (!res.ok) {
          setStatus(`Search error: ${data.error || res.statusText}`, true);
          return;
        }
        if (!Array.isArray(data) || data.length === 0) {
          setStatus('No results found. Try another search term.', true);
          return;
        }

        statusBox.style.display = 'none';
        document.getElementById('results').innerHTML = data.map(song => `
          <li>
            <div class="meta">
              <div class="title">${escapeHtml(song.title)}</div>
              <div class="artist">${escapeHtml(song.artist)}</div>
            </div>
            <button onclick="playSong('${song.id}', '${escapeHtml(song.title).replace(/'/g, "\\'")}')">Play</button>
          </li>
        `).join('');
      } catch (err) {
        setStatus(`Network error: ${err.message}`, true);
      }
    }

    function extractVideoId(input) {
      const match = input.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(input.trim())) return input.trim();
      return null;
    }

    function playDirect() {
      const val = document.getElementById('directInput').value.trim();
      const id = extractVideoId(val);
      if (!id) {
        setStatus('Invalid YouTube URL or 11-character Video ID.', true);
        return;
      }
      playSong(id, id);
    }

    function playSong(videoId, label) {
      setStatus(`Loading Opus stream for: ${label}...`);
      player.src = `/api/stream/${videoId}`;
      player.play()
        .then(() => setStatus(`Playing: ${label}`))
        .catch(err => setStatus(`Playback failed: ${err.message}. Check /api/stream/${videoId} in a new tab for details.`, true));
    }

    player.onerror = () => {
      setStatus('Stream error: The server could not fetch audio for this track (likely a datacenter IP block on Vercel).', true);
    };

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
  </script>
</body>
</html>
